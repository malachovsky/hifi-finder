name: Update hi-fi listings

on:
  schedule:
    # 05:00 and 17:00 UTC = 07:00 and 19:00 Slovak summer time (06:00 / 18:00 in winter)
    - cron: "0 5,17 * * *"
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab

permissions:
  contents: write              # commit data/seen.json so "New" and price drops work
  pages: write
  id-token: write

concurrency:
  group: hifi-watch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # latest main, not the commit the (possibly queued) run was triggered on

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search marketplaces and build page
        run: python watch.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save state
        run: |
          git config user.name "hifi-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Listings update $(date -u +'%Y-%m-%d %H:%M')" || echo "Nothing changed"
          # main may have moved during the run (e.g. a manual push); this run's data/ wins on conflict
          git pull --rebase -X theirs origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
